<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioDiet</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f3f1;
        }
        .day-card {
            min-height: 250px;
            display: flex;
            flex-direction: column;
        }
        .checkbox-container {
            display: flex;
            align-items: flex-start;
            margin-bottom: 0.5rem;
            cursor: pointer;
            position: relative;
            padding-right: 1.5rem;
        }
        .custom-checkbox {
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid;
            border-radius: 0.25rem;
            margin-right: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .custom-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 1rem;
            font-weight: bold;
        }
        .day-label {
            font-size: 0.875rem;
            color: #6b7280;
        }
        .section-divider {
            border-top: 1px solid;
            margin-top: 1rem;
            margin-bottom: 1rem;
        }
        /* Custom colors for each week */
        .week-1 { background-color: #fde8ed; border-color: #f7a7b4; } /* Period - red */
        .week-1 .custom-checkbox { border-color: #ef4444; }
        .week-1 .custom-checkbox.checked { background-color: #ef4444; }
        .week-2 { background-color: #d1fae5; border-color: #6ee7b7; } /* Follicular - green */
        .week-2 .custom-checkbox { border-color: #22c55e; }
        .week-2 .custom-checkbox.checked { background-color: #22c55e; }
        .week-3 { background-color: #fffbeb; border-color: #fcd34d; } /* Ovulation - yellow */
        .week-3 .custom-checkbox { border-color: #f97316; }
        .week-3 .custom-checkbox.checked { background-color: #f97316; }
        .week-4 { background-color: #e0f2fe; border-color: #93c5fd; } /* Luteal - blue */
        .week-4 .custom-checkbox { border-color: #3b82f6; }
        .week-4 .custom-checkbox.checked { background-color: #3b82f6; }

        /* Styles for disabled items */
        .checkbox-container.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        .checkbox-container.disabled .custom-checkbox {
            border-color: #d1d5db;
        }
        .fasting-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cancel-btn {
            padding: 4px 8px;
            background-color: #ef4444;
            color: white;
            border-radius: 9999px;
            font-size: 0.75rem;
            cursor: pointer;
            display: none;
            border: none;
            outline: none;
            transition: background-color 0.2s;
        }
        .cancel-btn:hover {
            background-color: #dc2626;
        }
        .progress-bar-container {
            width: 100%;
            background-color: #e5e7eb;
            border-radius: 9999px;
            overflow: hidden;
        }
        .progress-bar {
            height: 1rem;
            background-color: #a855f7;
            transition: width 0.5s ease-in-out;
            text-align: right;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            line-height: 1rem;
        }
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 2rem;
            border-radius: 0.5rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        /* Delete button for supplements - visibility controlled by JS */
        .delete-btn {
            background: none;
            border: none;
            font-size: 1rem;
            line-height: 1rem;
            color: #ef4444;
            cursor: pointer;
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            padding: 0;
            display: none; /* Initially hidden */
        }
        /* Show delete button when container is selected */
        .checkbox-container.selected .delete-btn {
            display: block;
        }
        /* Styles for the day's master checkbox next to the Day number */
        .day-master-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: flex-start;
        }
        .day-master-checkbox {
            cursor: pointer;
        }
    </style>
</head>

                        <label class="flex items-center gap-1"><input type="checkbox" value="3"> 3주차</label>

                <button id="save-supplement-btn" class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600">추가</button>
            </div>

    </div>
</div>

    // Data for each week's routine, structured by time and meal

    const routines = {
        1: {

            sections: [

            ]
        },
        2: {
            title: '🌸 2주차 (난포기, 16:8)',
            sections: [
                { title: '아침 공복', items: [] },
                { title: '아침', items: ['아침 (09:00): 단쉐, 두유', '아침 식후 운동(계단 오르기)'] },

                { title: '오후/저녁', items: ['15:00 간식: 단쉐', '저녁 (17:00): 단채 🔴 (운동↑날 🟡 탄수 ⅓공기 허용)', '저녁 식후 운동(계단 오르기)'] },
                { title: '취침 전', items: ['17:00~09:00 단식 (16h)', '23:30~06:30 수면 (7h)', '24h 단식 (점심 → 다음날 점심)'] }
            ]
        },
        3: {
            title: '🌕 3주차 (배란기, 16:8)',
            sections: [
                { title: '아침 공복', items: [] },
                { title: '아침', items: ['아침 (09:00): 단쉐, 두유', '아침 식후 운동(계단 오르기)'] },
                { title: '점심', items: ['점심 (12:30): 단채밥 🟡 아주 적게 (⅓~½공기)', '식후: (샐러드+올리브오일)', '점심 식후 운동(계단 오르기)'] },

    const calendarGrid = document.getElementById('calendar-grid');
    const startDateInput = document.getElementById('start-date');
    const ptDaySelector = document.getElementById('pt-day-selector');
    const disableSupplementsToggle = document.getElementById('disable-supplements-toggle');

    const supplementWeeksSelector = document.getElementById('supplement-weeks-selector');
    const overallCheckRateEl = document.getElementById('overall-check-rate');
    const overallProgressEl = document.getElementById('overall-progress');
    const diagnosticMessageEl = document.getElementById('diagnostic-message');
    const weekRateElements = {
        1: document.getElementById('week-1-rate'),
        2: document.getElementById('week-2-rate'),
        3: document.getElementById('week-3-rate'),
        4: document.getElementById('week-4-rate')
    };
    const dayNames = ['일', '월', '화', '수', '목', '금', '토'];

    // Map week numbers to Tailwind CSS color classes
    const weekColors = {
        1: 'week-1',
        2: 'week-2',
        3: 'week-3',
        4: 'week-4'
    };

    /**
     * Checks if a checklist item is a supplement.
     * @param {string} itemText - The text of the checklist item.
     * @returns {boolean} True if the item is a supplement, false otherwise.
     */
    function isSupplement(itemText) {
        const predefinedNames = Object.keys(predefinedSupplements);
        const customSupplements = JSON.parse(localStorage.getItem('customSupplements') || '{}');
        
        // Check if the item matches any predefined supplement name
        let isDefaultSupplement = predefinedNames.some(name => itemText.includes(name));
        
        if (isDefaultSupplement) return true;

        // Check if the item is a user-added custom supplement
        for (const week in customSupplements) {
            if (customSupplements[week].some(sup => itemText.includes(sup.name))) {
                return true;
            }
        }
        return false;
    }

    /**
     * Checks if a checklist item is a user-added custom supplement.
     * @param {string} itemText - The text of the checklist item.
     * @param {number} week - The week number of the item.
     * @returns {boolean} True if the item is a custom supplement, false otherwise.
     */
    function isCustomSupplement(itemText, week) {
        const predefinedNames = Object.keys(predefinedSupplements);
        const isDefault = predefinedNames.some(name => itemText.includes(name));
        if (isDefault) {
            return false;
        }

        const customSupplements = JSON.parse(localStorage.getItem('customSupplements') || '{}');
        const supplementsInWeek = customSupplements[week];
        return supplementsInWeek && supplementsInWeek.some(sup => itemText.includes(sup.name));
    }
    
    /**
     * Toggles the disabled state of checklist items for the 24h fasting period.
     * @param {number} day - The current day number.
     * @param {boolean} isDisabled - True to disable, false to enable.
     */
    function toggleFastingItems(day, isDisabled) {
        const currentDayCard = document.getElementById(`day-${day}`);
        const nextDayCard = document.getElementById(`day-${day + 1}`);
        let itemsToToggle = [];

        if (currentDayCard) {
            const currentDayAfternoonItems = Array.from(currentDayCard.querySelectorAll('.text-md[title*="오후/저녁"] + div .checkbox-container'));
            currentDayAfternoonItems.forEach(item => {
                const labelText = item.querySelector('span').textContent;
                if (labelText.includes('간식:') || labelText.includes('저녁:')) {
                    itemsToToggle.push(item);
                }
            });
        }

        if (nextDayCard) {
            const nextDayMorningItems = Array.from(nextDayCard.querySelectorAll('.text-md[title*="아침"] + div .checkbox-container'));
            nextDayMorningItems.forEach(item => {
                const labelText = item.querySelector('span').textContent;
                if (labelText.includes('아침:')) {
                    itemsToToggle.push(item);
                }
            });
        }

        itemsToToggle.forEach(item => {
            if (isDisabled) {
                item.classList.add('disabled');
                item.querySelector('.custom-checkbox').classList.remove('checked');
            } else {
                item.classList.remove('disabled');
            }
        });
    }

    /**
     * Calculates and displays the check rate and diagnostic message.
     */
    function updateDiagnostics() {
        const checklistState = JSON.parse(localStorage.getItem('checklistState') || '{}');
        const totalItemsByWeek = { 1: 0, 2: 0, 3: 0, 4: 0 };
        const checkedItemsByWeek = { 1: 0, 2: 0, 3: 0, 4: 0 };
        let overallTotal = 0;
        let overallChecked = 0;

        const isSupplementsDisabled = disableSupplementsToggle.checked;

        // Iterate through all days and all items to count total and checked
        for (let day = 1; day <= 28; day++) {
            const dayCard = document.getElementById(`day-${day}`);
            if (dayCard) {
                const dayInCycle = parseInt(dayCard.dataset.dayInCycle, 10);
                const week = Math.ceil(dayInCycle / 7);

                // Get all checklist containers for the current day
                const containers = dayCard.querySelectorAll('.checkbox-container');
                let dayTotal = 0;
                let dayChecked = 0;

                containers.forEach(container => {
                    const itemId = container.dataset.itemId;
                    const itemText = container.querySelector('span').textContent;

                    // Exclude disabled supplement items from total count
                    if (isSupplementsDisabled && isSupplement(itemText)) {
                        return;
                    }
                    
                    overallTotal++;
                    dayTotal++;
                    totalItemsByWeek[week]++;
                    if (checklistState[itemId]) {
                        overallChecked++;
                        dayChecked++;
                        checkedItemsByWeek[week]++;
                    }
                });

                // Update the day's master checkbox
                const dayMasterCheckbox = dayCard.querySelector('.day-master-checkbox');
                if (dayMasterCheckbox) {
                    if (dayTotal > 0 && dayChecked === dayTotal) {
                        dayMasterCheckbox.classList.add('checked');
                    } else {
                        dayMasterCheckbox.classList.remove('checked');
                    }
                }
            }
        }

        // Calculate percentages
        const overallRate = overallTotal > 0 ? Math.round((overallChecked / overallTotal) * 100) : 0;
        const weekRates = {
            1: totalItemsByWeek[1] > 0 ? Math.round((checkedItemsByWeek[1] / totalItemsByWeek[1]) * 100) : 0,
            2: totalItemsByWeek[2] > 0 ? Math.round((checkedItemsByWeek[2] / totalItemsByWeek[2]) * 100) : 0,
            3: totalItemsByWeek[3] > 0 ? Math.round((checkedItemsByWeek[3] / totalItemsByWeek[3]) * 100) : 0,
            4: totalItemsByWeek[4] > 0 ? Math.round((checkedItemsByWeek[4] / totalItemsByWeek[4]) * 100) : 0,
        };

        // Update UI
        overallCheckRateEl.textContent = `${overallRate}%`;
        overallProgressEl.style.width = `${overallRate}%`;
        overallProgressEl.textContent = overallRate > 10 ? `${overallRate}%` : '';

        for (const week in weekRates) {
            weekRateElements[week].textContent = `${weekRates[week]}%`;
        }

        // Display diagnostic message based on overall rate
        let message = '';
        if (overallRate >= 80) {
            message = '✅ 훌륭해요! 꾸준한 노력이 건강 회복의 가능성을 높이고 있어요!';
        } else if (overallRate >= 50) {
            message = '👍 잘하고 있어요! 조금만 더 힘내서 목표에 한 발짝 더 다가가 보세요.';
        } else {
            message = '🌱 매일 조금씩이라도 꾸준히 해나가는 것이 중요해요! 오늘부터 다시 시작해 볼까요?';
        }
        diagnosticMessageEl.textContent = message;
    }

    /**
     * Renders the 28-day calendar with routines based on settings.
     * @param {string} startDateString - The start date in 'YYYY-MM-DD' format.
     * @param {Array<number>} ptDays - An array of numbers representing selected PT days.
     * @param {boolean} disableSupplements - Flag to disable supplement checkboxes.
     */
    function renderCalendar(startDateString, ptDays, disableSupplements) {
        calendarGrid.innerHTML = '';
        const startDate = new Date(startDateString);
        const today = new Date();
        const checklistState = JSON.parse(localStorage.getItem('checklistState') || '{}');
        const customSupplements = JSON.parse(localStorage.getItem('customSupplements') || '{}');
        
        const diffFromStartInMs = today.getTime() - startDate.getTime();
        const diffFromStartInDays = Math.floor(diffFromStartInMs / (1000 * 60 * 60 * 24));
        const currentDayInCycle = ((diffFromStartInDays % 28) + 28) % 28 + 1;

        for (let i = 0; i < 28; i++) {
            const currentDate = new Date(today);
            currentDate.setDate(today.getDate() + i);
            const formattedDate = currentDate.toISOString().slice(0, 10);
            const dayOfWeek = currentDate.getDay(); // 0 = Sunday, 1 = Monday, etc.
            
            const dayInCycle = ((currentDayInCycle + i - 1) % 28) + 1;
            const week = Math.ceil(dayInCycle / 7);
            
            const weekData = JSON.parse(JSON.stringify(routines[week]));
            if (!weekData) continue;

            // Add predefined supplements to the appropriate section based on time
            for (const name in predefinedSupplements) {
                const sup = predefinedSupplements[name];
                if (sup.weeks.includes(week)) {
                    const supplementText = sup.context ? `${name} (${sup.context})` : name;
                    
                    // Fix: Use exact title match for supplement placement
                    const section = weekData.sections.find(s => s.title === sup.time);
                    if (section) {
                         // Check for existing text to avoid duplicates
                        if (!section.items.includes(supplementText)) {
                            section.items.push(supplementText);
                        }
                    }
                }
            }

            // Add custom supplements
            if (customSupplements[week]) {
                customSupplements[week].forEach(sup => {
                    const section = weekData.sections.find(s => s.title.includes(sup.time));
                    if (section) {
                        const supplementText = sup.context ? `${sup.name} (${sup.context})` : sup.name;
                        if (!section.items.includes(supplementText)) {
                            section.items.push(supplementText);
                        }
                    }
                });
            }

            const dayCard = document.createElement('div');
            dayCard.id = `day-${i + 1}`;
            dayCard.className = `day-card p-4 rounded-xl shadow-lg border-2 transition-transform transform hover:scale-105 ${weekColors[week]}`;
            dayCard.dataset.dayInCycle = dayInCycle;
            dayCard.dataset.week = week;

            // Day master checkbox moved next to the Day number
            const dayMasterCheckbox = document.createElement('div');
            dayMasterCheckbox.className = `custom-checkbox day-master-checkbox`;

            const headerHtml = `
                <div class="mb-4 day-master-header">
                    <div class="text-xl font-bold text-gray-900 mb-1">Day ${dayInCycle}</div>
                    <div class="day-label">${weekData.title} | ${dayNames[dayOfWeek]} (${formattedDate})</div>
                </div>
            `;
            dayCard.innerHTML = headerHtml;
            dayCard.querySelector('.day-master-header').prepend(dayMasterCheckbox);

            dayMasterCheckbox.addEventListener('click', (event) => {
                event.stopPropagation();
                const dayId = event.target.closest('.day-card').id;
                const dayCard = document.getElementById(dayId);
                const allCheckboxes = dayCard.querySelectorAll('.checkbox-container:not(.disabled) .custom-checkbox:not(.day-master-checkbox)');
                const isChecked = event.target.classList.toggle('checked');

                const updatedState = JSON.parse(localStorage.getItem('checklistState') || '{}');

                allCheckboxes.forEach(checkbox => {
                    const container = checkbox.closest('.checkbox-container');
                    const itemId = container.dataset.itemId;
                    if (isChecked) {
                        checkbox.classList.add('checked');
                        updatedState[itemId] = true;
                    } else {
                        checkbox.classList.remove('checked');
                        updatedState[itemId] = false;
                    }
                });

                localStorage.setItem('checklistState', JSON.stringify(updatedState));
                updateDiagnostics();
            });

            weekData.sections.forEach((section, sectionIndex) => {
                const divider = document.createElement('div');
                divider.className = 'section-divider';
                dayCard.appendChild(divider);

                const sectionTitle = document.createElement('div');
                sectionTitle.className = 'text-md font-semibold text-gray-700 mb-2';
                sectionTitle.textContent = section.title;
                sectionTitle.setAttribute('title', section.title);
                dayCard.appendChild(sectionTitle);

                const checklistContainer = document.createElement('div');
                
                if (ptDays.includes(dayOfWeek) && section.title.includes('오후/저녁')) {
                    const ptCheckbox = createCheckboxElement('PT (개인 운동)', i + 1, `pt-${i + 1}`);
                    checklistContainer.appendChild(ptCheckbox);
                }
                
                section.items.forEach((itemText, itemIndex) => {
                    const itemId = `day-${i + 1}-s${sectionIndex}-i${itemIndex}`;
                    const checkbox = createCheckboxElement(itemText, i + 1, itemId, disableSupplements);
                    checklistContainer.appendChild(checkbox);
                });

                dayCard.appendChild(checklistContainer);
            });

            calendarGrid.appendChild(dayCard);
        }
    }

    /**
     * Helper function to create a new checkbox element.
     * @param {string} itemText - The text for the checklist item.
     * @param {number} day - The day number, used for the 24h fasting logic.
     * @param {string} itemId - The unique ID for localStorage.
     * @param {boolean} disableSupplements - Flag to disable supplement checkboxes.
     */
    function createCheckboxElement(itemText, day, itemId, disableSupplements) {
        const checklistState = JSON.parse(localStorage.getItem('checklistState') || '{}');
        const isChecked = checklistState[itemId] || false;
        
        const checkboxContainer = document.createElement('div');
        checkboxContainer.className = 'checkbox-container';
        checkboxContainer.dataset.itemId = itemId;

        const customCheckbox = document.createElement('div');
        customCheckbox.className = `custom-checkbox ${isChecked ? 'checked' : ''}`;

        const label = document.createElement('span');
        label.className = 'text-gray-800 text-sm';
        label.textContent = itemText;

        const isItemSupplement = isSupplement(itemText);
        const dayCard = document.getElementById(`day-${day}`);
        const week = dayCard ? dayCard.dataset.week : null;
        const isCustomSup = week ? isCustomSupplement(itemText, week) : false;

        if (isItemSupplement && disableSupplements) {
            checkboxContainer.classList.add('disabled');
        }

        if (itemText.includes('24h 단식')) {
            const fastingControls = document.createElement('div');
            fastingControls.className = 'fasting-controls';
            fastingControls.appendChild(customCheckbox);
            fastingControls.appendChild(label);
            
            const cancelButton = document.createElement('button');
            cancelButton.className = 'cancel-btn';
            cancelButton.textContent = '취소';
            if (isChecked) cancelButton.style.display = 'inline-block';
            fastingControls.appendChild(cancelButton);
            checkboxContainer.appendChild(fastingControls);

            cancelButton.addEventListener('click', (event) => {
                event.stopPropagation();
                const updatedState = JSON.parse(localStorage.getItem('checklistState') || '{}');
                updatedState[itemId] = false;
                localStorage.setItem('checklistState', JSON.stringify(updatedState));

                customCheckbox.classList.remove('checked');
                cancelButton.style.display = 'none';
                toggleFastingItems(day, false);
                updateDiagnostics();
            });

            customCheckbox.addEventListener('click', (event) => {
                event.stopPropagation();
                const updatedState = JSON.parse(localStorage.getItem('checklistState') || '{}');
                if (customCheckbox.classList.contains('checked')) {
                    updatedState[itemId] = false;
                    customCheckbox.classList.remove('checked');
                    cancelButton.style.display = 'none';
                    toggleFastingItems(day, false);
                } else {
                    updatedState[itemId] = true;
                    customCheckbox.classList.add('checked');
                    cancelButton.style.display = 'inline-block';
                    toggleFastingItems(day, true);
                }
                localStorage.setItem('checklistState', JSON.stringify(updatedState));
                updateDiagnostics();
            });
        } else {
            checkboxContainer.appendChild(customCheckbox);
            checkboxContainer.appendChild(label);
            
            // Add a delete button for custom supplements, initially hidden
            if (isCustomSup) {
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'X';
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const dayCard = e.target.closest('.day-card');
                    const week = dayCard.dataset.week;
                    
                    const supplementText = itemText;
                    deleteCustomSupplement(supplementText, week);
                });
                checkboxContainer.appendChild(deleteBtn);

                // Add a single click event listener to the container
                checkboxContainer.addEventListener('click', (e) => {
                    if (!isCustomSup) return; 

                    document.querySelectorAll('.checkbox-container.selected').forEach(el => el.classList.remove('selected'));
                    checkboxContainer.classList.toggle('selected');
                });
            }

            customCheckbox.addEventListener('click', (e) => {
                e.stopPropagation(); 
                if (checkboxContainer.classList.contains('disabled')) return;
                const updatedState = JSON.parse(localStorage.getItem('checklistState') || '{}');
                const isCurrentlyChecked = customCheckbox.classList.toggle('checked');
                updatedState[itemId] = isCurrentlyChecked;
                localStorage.setItem('checklistState', JSON.stringify(updatedState));
                updateDiagnostics();
            });
        }
        return checkboxContainer;
    }

    /**
     * Populates the supplement datalist.
     */
    function populateSupplementDatalist() {
        supplementDatalist.innerHTML = '';
        Object.keys(predefinedSupplements).forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            supplementDatalist.appendChild(option);
        });
    }

    /**
     * Shows the add supplement modal.
     */
    function showAddSupplementModal() {
        populateSupplementDatalist();
        supplementNameInput.value = "";
        supplementOptionsContainer.classList.add('hidden');
        addSupplementModal.style.display = 'flex';
    }

    /**
     * Hides the add supplement modal and resets form.
     */
    function hideAddSupplementModal() {
        addSupplementModal.style.display = 'none';
        supplementNameInput.value = '';
        supplementOptionsContainer.classList.add('hidden');
    }

    /**
     * Saves a new custom supplement to localStorage.
     * @param {string} name - The name of the supplement.
     * @param {Array<number>} weeks - The weeks to add the supplement to.
     * @param {string} time - The time slot for the supplement.
     * @param {string} context - The context (e.g., '공복', '식후').
     */
    function saveCustomSupplement(name, weeks, time, context) {
        const supplements = JSON.parse(localStorage.getItem('customSupplements') || '{}');
        weeks.forEach(week => {
            if (!supplements[week]) {
                supplements[week] = [];
            }
            // Check for duplicate to prevent adding the same supplement multiple times
            const supplementText = context ? `${name} (${context})` : name;
            if (!supplements[week].some(sup => sup.name === supplementText)) {
                supplements[week].push({ name: supplementText, time });
            }
        });
        localStorage.setItem('customSupplements', JSON.stringify(supplements));
    }
    
    /**
     * Deletes a custom supplement from localStorage.
     * @param {string} name - The name of the supplement to delete.
     * @param {string} week - The week the supplement belongs to.
     */
    function deleteCustomSupplement(name, week) {
        let supplements = JSON.parse(localStorage.getItem('customSupplements') || '{}');
        if (supplements[week]) {
            supplements[week] = supplements[week].filter(sup => sup.name !== name);
            if (supplements[week].length === 0) {
                delete supplements[week];
            }
        }
        localStorage.setItem('customSupplements', JSON.stringify(supplements));
        
        const currentStartDate = localStorage.getItem('startDate');
        const currentPtDays = JSON.parse(localStorage.getItem('ptDays')) || [];
        const currentSupplementsDisabled = disableSupplementsToggle.checked;
        renderCalendar(currentStartDate, currentPtDays, currentSupplementsDisabled);
        updateDiagnostics();
    }
    
    // Set up event listeners and initial load
    window.onload = function() {
        // Load settings from localStorage
        let storedDate = localStorage.getItem('startDate');
        if (!storedDate) {
            const today = new Date();
            storedDate = today.toISOString().slice(0, 10);
            localStorage.setItem('startDate', storedDate);
        }
        startDateInput.value = storedDate;

        let storedPtDays = JSON.parse(localStorage.getItem('ptDays')) || [];
        ptDaySelector.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            const dayOfWeek = parseInt(checkbox.dataset.dayOfWeek, 10);
            checkbox.checked = storedPtDays.includes(dayOfWeek);
        });

        let storedSupplementsDisabled = localStorage.getItem('disableSupplements') === 'true';
        disableSupplementsToggle.checked = storedSupplementsDisabled;
        
        // Initial render
        renderCalendar(storedDate, storedPtDays, storedSupplementsDisabled);
        updateDiagnostics();

        // Add event listener for start date changes
        startDateInput.addEventListener('change', (event) => {
            const selectedDate = event.target.value;
            if (selectedDate) {
                localStorage.setItem('startDate', selectedDate);
                const currentPtDays = JSON.parse(localStorage.getItem('ptDays')) || [];
                const currentSupplementsDisabled = disableSupplementsToggle.checked;
                renderCalendar(selectedDate, currentPtDays, currentSupplementsDisabled);
                updateDiagnostics();
            }
        });

        // Add event listener for PT day changes
        ptDaySelector.addEventListener('change', () => {
            const selectedDays = [];
            ptDaySelector.querySelectorAll('input[type="checkbox"]:checked').forEach(checkbox => {
                selectedDays.push(parseInt(checkbox.dataset.dayOfWeek, 10));
            });
            localStorage.setItem('ptDays', JSON.stringify(selectedDays));
            const currentStartDate = localStorage.getItem('startDate');
            const currentSupplementsDisabled = disableSupplementsToggle.checked;
            renderCalendar(currentStartDate, selectedDays, currentSupplementsDisabled);
            updateDiagnostics();
        });

        // Add event listener for supplements toggle change
        disableSupplementsToggle.addEventListener('change', (event) => {
            const isDisabled = event.target.checked;
            localStorage.setItem('disableSupplements', isDisabled);
            const currentStartDate = localStorage.getItem('startDate');
            const currentPtDays = JSON.parse(localStorage.getItem('ptDays')) || [];
            renderCalendar(currentStartDate, currentPtDays, isDisabled);
            updateDiagnostics();
        });

        // Add event listener for add supplement button
        addSupplementBtn.addEventListener('click', showAddSupplementModal);

        // Add event listeners for modal buttons
        cancelSupplementBtn.addEventListener('click', hideAddSupplementModal);
        
        // Handle supplement selection logic
        supplementNameInput.addEventListener('input', (event) => {
            const selectedName = event.target.value;
            const supplementData = predefinedSupplements[selectedName];
            
            if (supplementData) {
                supplementOptionsContainer.classList.add('hidden');
            } else {
                supplementOptionsContainer.classList.remove('hidden');
            }
        });

        saveSupplementBtn.addEventListener('click', () => {
            const supplementName = supplementNameInput.value.trim();
            if (!supplementName) {
                console.log("영양제 이름을 입력해주세요.");
                return;
            }

            const supplementData = predefinedSupplements[supplementName];
            let supplementTime, supplementWeeks, supplementContext;
            let isCustom = false;

            if (supplementData) {
                supplementTime = supplementData.time;
                supplementWeeks = supplementData.weeks;
                supplementContext = supplementData.context;
            } else {
                // Handle custom supplement
                isCustom = true;
                supplementTime = supplementTimeSelect.value;
                supplementWeeks = Array.from(supplementWeeksSelector.querySelectorAll('input:checked')).map(cb => parseInt(cb.value, 10));
                
                if (supplementWeeks.length === 0) {
                    console.log("적용할 생리 주차를 하나 이상 선택해주세요.");
                    return;
                }
            }
            
            saveCustomSupplement(supplementName, supplementWeeks, supplementTime, supplementContext);
            hideAddSupplementModal();
            const currentStartDate = localStorage.getItem('startDate');
            const currentPtDays = JSON.parse(localStorage.getItem('ptDays')) || [];
            const currentSupplementsDisabled = disableSupplementsToggle.checked;
            renderCalendar(currentStartDate, currentPtDays, currentSupplementsDisabled);
            updateDiagnostics();
        });
    };
</script>
